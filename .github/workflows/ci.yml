name: CI (checks on every pull request)

on:
  pull_request:
  push:
    branches-ignore: ['main']

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run sanity
      - run: npm run adversarial
      - name: Clinical review documents are up to date
        run: |
          npm run review:docs
          git diff --exit-code -I "enerated [0-9]{4}-[0-9]{2}-[0-9]{2}" -- docs/clinical-review || (echo "docs/clinical-review is stale: run npm run review:docs and commit" && exit 1)
      - run: npm run build
