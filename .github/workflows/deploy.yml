name: Deploy Open Anesthesia 4D PWA to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      # Release gate (audit F15): nothing is published unless types, physics sanity checks,
      # adversarial regression tests and the generated clinical-review documents all pass.
      - run: npm run typecheck
      - run: npm run sanity
      - run: npm run adversarial
      - name: Clinical review documents are up to date
        run: |
          npm run review:docs
          git diff --exit-code -I "enerated [0-9]{4}-[0-9]{2}-[0-9]{2}" -- docs/clinical-review || (echo "docs/clinical-review is stale: run npm run review:docs and commit" && exit 1)
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
